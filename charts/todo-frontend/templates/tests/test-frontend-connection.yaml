apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-frontend.fullname" . }}-test
  annotations:
    "helm.sh/hook": test
data:
  run_test.sh: |
    @test "Frontend Health Check" {
      url="http://{{ include "todo-frontend.fullname" . }}:{{ .Values.service.port }}/"
      code=$(wget --server-response --spider --timeout=5 "${url}" 2>&1 | grep "HTTP/" | awk '{print $2}')
      [ "$code" -ge 200 ] && [ "$code" -lt 400 ]
    }

    @test "Frontend Service Port Check" {
      nc -z {{ include "todo-frontend.fullname" . }} {{ .Values.service.port }}
      [ $? -eq 0 ]
    }