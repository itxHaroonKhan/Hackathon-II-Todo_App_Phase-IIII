apiVersion: v2
name: todo-app
description: Umbrella Helm chart for Todo application with frontend and backend
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: todo-backend
    version: 0.1.0
    repository: "file://../todo-backend"
    condition: backend.enabled
  - name: todo-frontend
    version: 0.1.0
    repository: "file://../todo-frontend"
    condition: frontend.enabled